global:
  scrape_interval: 15s
scrape_configs:
  - job_name: enterpriseai-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: falkordb
    static_configs:
      - targets: [falkordb-exporter:9121]
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: [qdrant:6333]

