name: enterpriseai
services:
  web:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    depends_on:
      api: { condition: service_healthy }
  api:
    build: ./backend
    restart: unless-stopped
    environment: &backend-env
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      VISION_MODEL: ${VISION_MODEL:-llava:7b}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-enterpriseai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enterpriseai}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: enterpriseai
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      FALKORDB_GRAPH: enterpriseai
      REDIS_STREAM: enterpriseai:events
      REDIS_DEAD_STREAM: enterpriseai:events:dead
      ZAPIER_WEBHOOK_URL: ${ZAPIER_WEBHOOK_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@enterpriseai.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      falkordb: { condition: service_healthy }
      redis: { condition: service_healthy }
      ollama: { condition: service_healthy }
    volumes: [whisper-data:/root/.cache/huggingface]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM: enterpriseai:events
      REDIS_DEAD_STREAM: enterpriseai:events:dead
      ZAPIER_WEBHOOK_URL: ${ZAPIER_WEBHOOK_URL:-}
    depends_on:
      redis: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterpriseai}
      POSTGRES_USER: ${POSTGRES_USER:-enterpriseai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      test: ["CMD", "bash", "-lc", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20
  falkordb:
    image: falkordb/falkordb-server:latest
    restart: unless-stopped
    command: ["--appendonly", "yes"]
    volumes: [falkordb-data:/var/lib/falkordb/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["public-preview"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on:
      web: { condition: service_started }
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes: [./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [api, worker, postgres-exporter, redis-exporter, falkordb-exporter]
  grafana:
    image: grafana/grafana:13.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: [grafana-data:/var/lib/grafana, ./ops/grafana/provisioning:/etc/grafana/provisioning:ro, ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-enterpriseai}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-enterpriseai}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }
  falkordb-exporter:
    image: oliver006/redis_exporter:v1.69.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://falkordb:6379
    depends_on:
      falkordb: { condition: service_healthy }

volumes:
  postgres-data: {}
  qdrant-data: {}
  falkordb-data: {}
  redis-data: {}
  ollama-data: {}
  whisper-data: {}
  prometheus-data: {}
  grafana-data: {}

